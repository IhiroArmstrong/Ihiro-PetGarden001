<svg viewBox="0 0 240 270" width="240" height="270" xmlns="http://www.w3.org/2000/svg">

  <!-- 尾巴 + 尾尖绒毛 -->
  <path class="cat-tail"
    d="M162,228
       C205,224 224,178 206,138
       C196,118 168,122 164,138
       C160,152 172,162 182,176
       C196,198 188,222 154,226 Z"
    fill="#FFF6EC" stroke="#E8A87C" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round"/>
  <path class="cat-tail-fluff"
    d="M208,152 C214,148 216,156 210,160 C214,164 210,170 204,166 C206,160 205,155 208,152 Z"
    fill="#FFF6EC" stroke="#E8A87C" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse class="cat-patch-tail-tip" cx="192" cy="152" rx="11" ry="13"
    fill="#C9B6E4" opacity="0.55" transform="rotate(-10 192 152)"/>

  <!-- 身体 -->
  <path class="cat-body"
    d="M120,118
       C158,118 188,148 188,188
       C188,218 168,248 120,252
       C72,248 52,218 52,188
       C52,148 82,118 120,118 Z"
    fill="#FFF6EC" stroke="#E8A87C" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 胸口绒毛 -->
  <path class="cat-chest-fluff"
    d="M112,132 C108,126 114,122 118,128 C122,122 128,126 124,132 C120,128 116,128 112,132 Z"
    fill="#FFF6EC" stroke="#E8A87C" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 连续头脸轮廓（苹果形）：左耳→左颊→圆润下巴→右颊→右耳→平滑头顶弧线，一笔闭合，无断裂/无凹角 -->
  <path class="cat-head"
    d="M61,58
       C54,45 58,28 74,21
       C83,18 94,27 97,42
       C100,54 94,68 85,78
       C78,86 80,96 87,102
       C94,108 105,114 120,116
       C135,114 146,108 153,102
       C160,96 162,86 155,78
       C146,68 140,54 143,42
       C146,27 157,18 166,21
       C182,28 186,45 179,58
       C170,50 140,45 120,46
       C100,45 70,50 61,58 Z"
    fill="#FFF6EC" stroke="#E8A87C" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 头顶绒毛（简化为一小簇，位于头顶圆弧之上，不破坏轮廓） -->
  <path class="cat-head-fluff-top"
    d="M112,38 C109,33 114,30 117,35 C120,30 126,30 128,35 C131,31 136,34 133,39 C126,36 118,36 112,38 Z"
    fill="#FFF6EC" stroke="#E8A87C" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 耳内（圆润三角） -->
  <path class="cat-ear-inner-left"
    d="M74,50 C71,38 78,30 88,36 C93,40 91,51 84,56 C80,59 76,56 74,50 Z"
    fill="#FFC1CC"/>
  <path class="cat-ear-inner-right"
    d="M166,50 C169,38 162,30 152,36 C147,40 149,51 156,56 C160,59 164,56 166,50 Z"
    fill="#FFC1CC"/>

  <!-- 额纹 -->
  <path class="cat-marking-forehead"
    d="M99,34 L105,49 M120,31 L120,49 M141,34 L135,49"
    stroke="#FFB98A" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>

  <!-- 侧斑 -->
  <ellipse class="cat-patch-side" cx="160" cy="200" rx="18" ry="22"
    fill="#FFB98A" opacity="0.4" transform="rotate(12 160 200)"/>

  <!-- 眼睛（放大 10%，间距加宽 5%） -->
  <g class="cat-eye-left">
    <ellipse cx="92" cy="76" rx="16.5" ry="20" fill="#3A2E2E"/>
    <circle cx="92" cy="79" r="10" fill="#8FD3C0"/>
    <circle cx="92" cy="79" r="4.5" fill="#2A2018"/>
    <circle cx="88" cy="72" r="3.5" fill="#FFFFFF"/>
    <circle cx="96" cy="84" r="2.2" fill="#FFFFFF" opacity="0.85"/>
  </g>
  <g class="cat-eye-right">
    <ellipse cx="148" cy="76" rx="16.5" ry="20" fill="#3A2E2E"/>
    <circle cx="148" cy="79" r="10" fill="#8FD3C0"/>
    <circle cx="148" cy="79" r="4.5" fill="#2A2018"/>
    <circle cx="144" cy="72" r="3.5" fill="#FFFFFF"/>
    <circle cx="152" cy="84" r="2.2" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- 口鼻（小鼻 + 微笑，无独立脸颊块） -->
  <path class="cat-nose"
    d="M120,88 C118,86 115,86 115,89
       C115,93 120,97 120,97
       C120,97 125,93 125,89
       C125,86 122,86 120,88 Z"
    fill="#FF7FA0"/>
  <path class="cat-mouth"
    d="M120,97 Q114,104 108,100 M120,97 Q126,104 132,100"
    stroke="#8A6C5C" stroke-width="2.2" fill="none"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 项圈 -->
  <path class="cat-collar"
    d="M94,118 Q120,128 146,118"
    stroke="#8FD3C0" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle class="cat-collar-charm" cx="120" cy="128" r="6.5"
    fill="#BFEDE0" stroke="#6FBFA8" stroke-width="1.5"/>

  <!-- 前爪 -->
  <ellipse class="cat-paw-left" cx="98" cy="244" rx="16" ry="11"
    fill="#FFF6EC" stroke="#E8A87C" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse class="cat-paw-right" cx="142" cy="244" rx="16" ry="11"
    fill="#FFF6EC" stroke="#E8A87C" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round"/>
  <path class="cat-paw-toes-left"
    d="M91,247 L91,251 M98,248 L98,252 M105,247 L105,251"
    stroke="#E8A87C" stroke-width="1.6" stroke-linecap="round"/>
  <path class="cat-paw-toes-right"
    d="M135,247 L135,251 M142,248 L142,252 M149,247 L149,251"
    stroke="#E8A87C" stroke-width="1.6" stroke-linecap="round"/>

</svg>
