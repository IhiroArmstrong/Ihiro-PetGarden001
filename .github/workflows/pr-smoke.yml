name: PR smoke (logic + browser shell)

# Fast gate for every PR → develop. Always reports a status (even when product
# paths are untouched) so `test:pr-smoke` can be a GitHub Required check without
# blocking docs-only / workflow-only PRs.
# Full e2e / visibility / doc-contract run separately (pre-merge or scheduled).
# Menu full-walk is NOT in default browser smoke (flake amplifier). It still
# runs here when menu paths change — see docs/PR_SMOKE_FAILURE_CLASSES.md.
on:
  pull_request:
    branches:
      - develop

jobs:
  pr-smoke:
    name: test:pr-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: focus-tiger
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect product paths
        id: paths
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$BASE"..."$HEAD" | grep -E '^(focus-tiger/|\.github/workflows/pr-smoke\.yml)' >/dev/null; then
            echo "product=true" >> "$GITHUB_OUTPUT"
            echo "Product paths changed — running smoke + build."
          else
            echo "product=false" >> "$GITHUB_OUTPUT"
            echo "No focus-tiger / pr-smoke.yml changes — skipping tests (Required-check no-op success)."
          fi

      - name: Detect menu-reachability paths
        id: menu_paths
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          # Must equal MENU_REACHABILITY_TRIGGER_PATH_RE in
          # focus-tiger/scripts/menu-reachability-trigger-paths.js
          MENU_RE='^(focus-tiger/src/ui/NarrowIdleShell|focus-tiger/src/ui/WideIdleMoreMenu|focus-tiger/src/core/idleChromeOrchestration|focus-tiger/src/core/IdleChromeFacade|focus-tiger/src/core/createIdleChromeFacade|focus-tiger/src/core/menuReachabilityContract|focus-tiger/src/core/wideMenuRadialLayout|focus-tiger/src/core/electronIdleContextMenu|focus-tiger/src/locales/slices/menu-|focus-tiger/e2e/menu-full-reachability|focus-tiger/e2e/wide-idle-more-menu|focus-tiger/e2e/helpers/product-shell\.js|\.github/workflows/menu-full-reachability\.yml)'
          if git diff --name-only "$BASE"..."$HEAD" | grep -E "$MENU_RE" >/dev/null; then
            echo "menu=true" >> "$GITHUB_OUTPUT"
            echo "Menu paths changed — will run menu-full-reachability after browser smoke."
          else
            echo "menu=false" >> "$GITHUB_OUTPUT"
            echo "No menu-reachability trigger paths — skipping menu full walk."
          fi

      - name: Skip notice (non-product PR)
        if: steps.paths.outputs.product != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          echo "test:pr-smoke skipped (no product paths). Job exits green so Required check stays safe."

      - uses: actions/setup-node@v7
        if: steps.paths.outputs.product == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: focus-tiger/package-lock.json

      - name: Install dependencies
        if: steps.paths.outputs.product == 'true'
        run: npm ci

      - name: Logic smoke (node --test subset)
        if: steps.paths.outputs.product == 'true'
        run: npm run test:smoke

      - name: Install Playwright Chromium
        if: steps.paths.outputs.product == 'true'
        run: npx playwright install chromium --with-deps

      - name: Browser smoke (Playwright subset)
        if: steps.paths.outputs.product == 'true'
        run: npm run test:e2e:smoke
        env:
          CI: 'true'
          PLAYWRIGHT_CHANNEL: ''

      - name: Menu full reachability (path-triggered)
        if: steps.paths.outputs.product == 'true' && steps.menu_paths.outputs.menu == 'true'
        run: npm run test:e2e:menu-reachability
        env:
          CI: 'true'
          PLAYWRIGHT_CHANNEL: ''

      - name: Upload Playwright failure artifacts
        if: steps.paths.outputs.product == 'true' && (failure() || cancelled())
        uses: actions/upload-artifact@v4
        with:
          name: pr-smoke-playwright-results
          path: focus-tiger/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Production build
        if: steps.paths.outputs.product == 'true'
        run: npm run build

      - name: Verify build artifacts
        if: steps.paths.outputs.product == 'true'
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/assets
          echo "Build OK: dist/index.html + dist/assets present"
          du -sh dist
          npm run build:verify-no-qa-boot
