name: focus-tiger visibility-contract e2e

# When suppress / park / hide chrome changes, run the full Visibility Contract
# e2e anchor set (not only the new feature's own tests).
#
# Plan A + workers:1 (WORKFLOW.md visibility CI 治理 · 2026-09-23):
# - 3 parallel jobs by spec (wall-clock budget per shard)
# - workers:1 per job (static :5199 preview load)
on:
  workflow_dispatch:
  push:
    paths:
      - 'focus-tiger/src/ui/NarrowIdleShell.js'
      - 'focus-tiger/src/ui/CompanionModePicker.js'
      - 'focus-tiger/src/ui/HonestyCheckInUI.js'
      - 'focus-tiger/src/ui/MicroRitualUI.js'
      - 'focus-tiger/src/ui/OnboardingHintsUI.js'
      - 'focus-tiger/src/main.js'
      - 'focus-tiger/src/core/visibilityContractRegistry.js'
      - 'focus-tiger/e2e/scenario-a.companion.spec.js'
      - 'focus-tiger/e2e/weekly-practice-heatmap.spec.js'
      - 'focus-tiger/e2e/micro-ritual.spec.js'
      - 'focus-tiger/e2e/helpers/product-shell.js'
      - 'focus-tiger/scripts/run-visibility-e2e.js'
      - 'focus-tiger/scripts/visibility-contract-doc-check.js'
      - 'focus-tiger/package.json'
      - 'focus-tiger/playwright.config.js'
      - 'focus-tiger/playwright.ci-visibility.config.js'
      - '.github/workflows/focus-tiger-visibility-contract.yml'
  pull_request:
    paths:
      - 'focus-tiger/src/ui/NarrowIdleShell.js'
      - 'focus-tiger/src/ui/CompanionModePicker.js'
      - 'focus-tiger/src/ui/HonestyCheckInUI.js'
      - 'focus-tiger/src/ui/MicroRitualUI.js'
      - 'focus-tiger/src/ui/OnboardingHintsUI.js'
      - 'focus-tiger/src/main.js'
      - 'focus-tiger/src/core/visibilityContractRegistry.js'
      - 'focus-tiger/e2e/scenario-a.companion.spec.js'
      - 'focus-tiger/e2e/weekly-practice-heatmap.spec.js'
      - 'focus-tiger/e2e/micro-ritual.spec.js'
      - 'focus-tiger/e2e/helpers/product-shell.js'
      - 'focus-tiger/scripts/run-visibility-e2e.js'
      - 'focus-tiger/scripts/visibility-contract-doc-check.js'
      - 'focus-tiger/package.json'
      - 'focus-tiger/playwright.config.js'
      - 'focus-tiger/playwright.ci-visibility.config.js'
      - '.github/workflows/focus-tiger-visibility-contract.yml'

jobs:
  visibility-preflight:
    name: visibility registry + doc-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: focus-tiger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: focus-tiger/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Structural visibility block (docs:check slice)
        run: npm run visibility:doc-check
      - name: Registry unit contracts
        run: node --test src/core/visibilityContractRegistry.test.js

  visibility-e2e:
    name: visibility e2e (${{ matrix.label }})
    needs: visibility-preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - spec: e2e/scenario-a.companion.spec.js
            label: scenario-a
            slug: scenario-a
            timeout_minutes: 75
          - spec: e2e/micro-ritual.spec.js
            label: micro-ritual
            slug: micro-ritual
            timeout_minutes: 45
          - spec: e2e/weekly-practice-heatmap.spec.js
            label: weekly-heatmap
            slug: weekly-heatmap
            timeout_minutes: 45
    # Per-spec budget (scenario-a is the heaviest shard; see visibility CI 治理 · 2026-09-24).
    timeout-minutes: ${{ matrix.timeout_minutes }}
    defaults:
      run:
        working-directory: focus-tiger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: focus-tiger/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Visibility e2e shard (${{ matrix.label }})
        run: >
          node scripts/e2e-ci-guard.js visibility &&
          npx playwright test ${{ matrix.spec }}
          --config=playwright.ci-visibility.config.js
          --workers=1
        env:
          CI: 'true'
          PLAYWRIGHT_CHANNEL: ''
          FT_VISIBILITY_SPEC: ${{ matrix.slug }}

      - name: Upload JUnit (always)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-visibility-${{ matrix.slug }}
          path: focus-tiger/test-results/junit-visibility-${{ matrix.slug }}.xml
          retention-days: 14
          if-no-files-found: warn

      - name: List Playwright test-results (debug)
        if: failure() || cancelled()
        run: ls -laR test-results/ 2>/dev/null | head -200 || echo "no test-results dir"
      - name: Upload Playwright failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: visibility-contract-playwright-${{ matrix.slug }}
          path: focus-tiger/test-results/
          retention-days: 7
          if-no-files-found: warn

  visibility-summary:
    name: visibility e2e summary
    runs-on: ubuntu-latest
    needs: visibility-e2e
    if: ${{ always() }}
    steps:
      - name: Download JUnit shards
        uses: actions/download-artifact@v8
        with:
          pattern: junit-visibility-*
          merge-multiple: true
          path: junit-shards
        continue-on-error: true

      - name: Print JUnit red/green list
        if: ${{ hashFiles('junit-shards/**/*.xml') != '' }}
        run: |
          python3 <<'PY'
          import pathlib, re, sys
          root = pathlib.Path('junit-shards')
          files = sorted(root.rglob('*.xml'))
          if not files:
              print('No junit XML downloaded (shards may have been killed before flush).')
              sys.exit(0)
          total = failures = errors = skipped = 0
          failed_names = []
          for f in files:
              text = f.read_text(encoding='utf-8', errors='replace')
              for m in re.finditer(r'<testsuite\b[^>]*>', text):
                  tag = m.group(0)
                  def attr(name):
                      mm = re.search(rf'\b{name}="([^"]*)"', tag)
                      return int(mm.group(1)) if mm and mm.group(1).isdigit() else 0
                  total += attr('tests')
                  failures += attr('failures')
                  errors += attr('errors')
                  skipped += attr('skipped')
              for m in re.finditer(
                  r'<testcase\b[^>]*\bclassname="([^"]*)"[^>]*\bname="([^"]*)"[^>]*>\s*<(failure|error)\b',
                  text,
                  re.S,
              ):
                  failed_names.append(f'{m.group(1)} › {m.group(2)} ({m.group(3)})')
          print(f'JUnit files: {len(files)}')
          print(f'tests={total} failures={failures} errors={errors} skipped={skipped}')
          if failed_names:
              print('Failed / errored cases:')
              for n in failed_names:
                  print(f'  - {n}')
          else:
              print('No failure/error testcase nodes in JUnit (flaky-retried green may look clean).')
          PY

      - name: Fail job if any shard failed
        if: ${{ needs.visibility-e2e.result != 'success' }}
        run: |
          echo "One or more visibility shards finished as: ${{ needs.visibility-e2e.result }}"
          exit 1
