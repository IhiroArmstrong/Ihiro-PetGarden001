name: Dependency audit (npm)

# Scheduled + manual: fail on high/critical advisories in web, desktop, and cloud lockfiles.
# Not a PR Required check (Dependabot PRs + human triage); keeps a periodic signal.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  npm-audit:
    name: npm audit (high+) · ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: focus-tiger
            dir: focus-tiger
            lockfile: focus-tiger/package-lock.json
          - package: desktop
            dir: focus-tiger/desktop
            lockfile: focus-tiger/desktop/package-lock.json
          - package: cloud
            dir: focus-tiger/cloud
            lockfile: focus-tiger/cloud/package-lock.json
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install dependencies
        run: npm ci

      - name: npm audit --audit-level=high
        run: npm audit --audit-level=high
