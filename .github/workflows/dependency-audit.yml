name: Dependency audit (npm)

# Scheduled + manual: fail on high/critical advisories in focus-tiger lockfile.
# Not a PR Required check (Dependabot PRs + human triage); keeps a periodic signal.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  npm-audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: focus-tiger
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: focus-tiger/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit --audit-level=high
        run: npm audit --audit-level=high
