name: focus-tiger hints doc-check

on:
  push:
    paths:
      - 'focus-tiger/src/core/onboardingHintRegistry.js'
      - 'focus-tiger/docs/ONBOARDING_HINTS.md'
      - 'focus-tiger/scripts/hints-doc-check.js'
      - 'focus-tiger/package.json'
      - '.github/workflows/focus-tiger-hints-doc-check.yml'
  pull_request:
    paths:
      - 'focus-tiger/src/core/onboardingHintRegistry.js'
      - 'focus-tiger/docs/ONBOARDING_HINTS.md'
      - 'focus-tiger/scripts/hints-doc-check.js'
      - 'focus-tiger/package.json'
      - '.github/workflows/focus-tiger-hints-doc-check.yml'

jobs:
  hints-doc-check:
    name: hints:doc-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: focus-tiger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify ONBOARDING_HINTS anchor block matches registry
        run: npm run hints:doc-check
