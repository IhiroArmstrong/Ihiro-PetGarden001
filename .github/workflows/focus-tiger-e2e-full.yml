name: focus-tiger full e2e

# Full Playwright suite on develop tip.
# Not a PR/merge gate — manual + daily schedule only.
#
# IMPORTANT (GitHub Actions): `schedule` loads this YAML from the repo
# **default branch** (since 2026-08-14: `develop`), then the job checks out
# `develop` for app code (or the dispatch `ref`). Nightly cron follows
# timeout / workers / shards on `develop`; do not sync this file to `main`
# just to refresh schedule. See docs/ENV_CONFIG.md §3.
# No repository Secrets required for this local-shell Playwright suite.
#
# Plan A (2026-07-31): 2 shards + junit always + slim artifacts — so a wall-clock
# cancel still leaves a pass/fail/flaky list instead of an empty/huge HTML report.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to test (branch / tag / SHA)'
        required: false
        default: 'develop'
  schedule:
    # Daily UTC 02:00
    - cron: '0 2 * * *'

jobs:
  e2e-full:
    name: full e2e (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Per-shard budget. Dual jobs cut wall-clock vs one 120m single lane.
    # Not a flaky root-cause fix — goto jitter still tracked separately.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: focus-tiger
    steps:
      - name: Checkout develop tip (or dispatch ref)
        uses: actions/checkout@v7
        with:
          # schedule checks out the default branch first; pin `develop` (or the
          # dispatch input) so the suite still tests the daily integration tip.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'develop' }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: focus-tiger/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # Guard + shard. CI-full config: junit + no HTML + retain-on-failure traces only.
      # --workers=1: avoid dual Chromium goto storms on ubuntu-latest.
      - name: Full Playwright e2e (shard)
        run: >
          node scripts/e2e-ci-guard.js full &&
          npx playwright test
          --config=playwright.ci-full.config.js
          --workers=1
          --shard=${{ matrix.shard }}/2
        env:
          CI: 'true'
          PLAYWRIGHT_CHANNEL: ''
          FT_SHARD: ${{ matrix.shard }}

      # Always upload junit so cancelled/failed shards still leave a red/green list.
      - name: Upload JUnit (always)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-full-e2e-shard-${{ matrix.shard }}
          path: focus-tiger/test-results/junit-shard-${{ matrix.shard }}.xml
          retention-days: 14
          if-no-files-found: warn

      # Traces/screenshots only — no HTML report (was ~14GB under flaky storms).
      - name: Upload failure traces (slim)
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-full-e2e-shard-${{ matrix.shard }}
          path: focus-tiger/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Surface shard conclusions in one place (does not re-run Playwright).
  e2e-full-summary:
    name: full e2e summary
    runs-on: ubuntu-latest
    needs: e2e-full
    if: ${{ always() }}
    steps:
      - name: Download JUnit shards
        uses: actions/download-artifact@v8
        with:
          pattern: junit-full-e2e-shard-*
          merge-multiple: true
          path: junit-shards
        continue-on-error: true

      - name: Print JUnit red/green list
        if: ${{ hashFiles('junit-shards/**/*.xml') != '' }}
        run: |
          python3 <<'PY'
          import pathlib, re, sys
          root = pathlib.Path('junit-shards')
          files = sorted(root.rglob('*.xml'))
          if not files:
              print('No junit XML downloaded (shards may have been killed before flush).')
              sys.exit(0)
          total = failures = errors = skipped = 0
          failed_names = []
          for f in files:
              text = f.read_text(encoding='utf-8', errors='replace')
              for m in re.finditer(r'<testsuite\b[^>]*>', text):
                  tag = m.group(0)
                  def attr(name):
                      mm = re.search(rf'\b{name}="([^"]*)"', tag)
                      return int(mm.group(1)) if mm and mm.group(1).isdigit() else 0
                  total += attr('tests')
                  failures += attr('failures')
                  errors += attr('errors')
                  skipped += attr('skipped')
              for m in re.finditer(
                  r'<testcase\b[^>]*\bclassname="([^"]*)"[^>]*\bname="([^"]*)"[^>]*>\s*<(failure|error)\b',
                  text,
                  re.S,
              ):
                  failed_names.append(f'{m.group(1)} › {m.group(2)} ({m.group(3)})')
          print(f'JUnit files: {len(files)}')
          print(f'tests={total} failures={failures} errors={errors} skipped={skipped}')
          if failed_names:
              print('Failed / errored cases:')
              for n in failed_names:
                  print(f'  - {n}')
          else:
              print('No failure/error testcase nodes in JUnit (flaky-retried green may look clean).')
          PY

      - name: Fail job if any shard failed
        if: ${{ needs.e2e-full.result != 'success' }}
        run: |
          echo "One or more shards finished as: ${{ needs.e2e-full.result }}"
          exit 1
