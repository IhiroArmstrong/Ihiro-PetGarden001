name: focus-tiger doc-contract check

on:
  push:
    paths:
      - 'focus-tiger/src/core/onboardingHintRegistry.js'
      - 'focus-tiger/src/core/sessionUiGateContractRegistry.js'
      - 'focus-tiger/src/core/visibilityContractRegistry.js'
      - 'focus-tiger/src/core/SessionUiGate.js'
      - 'focus-tiger/src/core/FocusSession.js'
      - 'focus-tiger/src/core/StateManager.js'
      - 'focus-tiger/docs/ONBOARDING_HINTS.md'
      - 'focus-tiger/docs/SHARED_RESOURCES.md'
      - 'focus-tiger/docs/ARCHITECTURE.md'
      - 'focus-tiger/docs/DOC_CODE_CONTRACT.md'
      - 'focus-tiger/docs/RULES_INDEX.md'
      - 'focus-tiger/docs/PROCESS.md'
      - 'focus-tiger/docs/DEV_WORKFLOW_QUALITY.md'
      - 'focus-tiger/docs/COLLAB.md'
      - 'WORKFLOW.md'
      - '.cursor/rules/focus-tiger-regression-lock.mdc'
      - '.cursor/rules/focus-tiger-docs.mdc'
      - 'focus-tiger/scripts/*-doc-check.js'
      - 'focus-tiger/scripts/check-docs-consistency.js'
      - 'focus-tiger/scripts/session-lock-lib.js'
      - 'focus-tiger/scripts/gate-session-lock-precommit.js'
      - 'focus-tiger/scripts/check-worktree-occupancy.js'
      - '.husky/pre-commit'
      - 'focus-tiger/scripts/rules-authority-registry.js'
      - 'focus-tiger/scripts/docs-check.js'
      - 'focus-tiger/package.json'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.cursor/rules/focus-tiger-browser-energy.mdc'
      - '.github/workflows/focus-tiger-doc-contract-check.yml'
  pull_request:
    paths:
      - 'focus-tiger/src/core/onboardingHintRegistry.js'
      - 'focus-tiger/src/core/sessionUiGateContractRegistry.js'
      - 'focus-tiger/src/core/visibilityContractRegistry.js'
      - 'focus-tiger/src/core/SessionUiGate.js'
      - 'focus-tiger/src/core/FocusSession.js'
      - 'focus-tiger/src/core/StateManager.js'
      - 'focus-tiger/docs/ONBOARDING_HINTS.md'
      - 'focus-tiger/docs/SHARED_RESOURCES.md'
      - 'focus-tiger/docs/ARCHITECTURE.md'
      - 'focus-tiger/docs/DOC_CODE_CONTRACT.md'
      - 'focus-tiger/docs/RULES_INDEX.md'
      - 'focus-tiger/docs/PROCESS.md'
      - 'focus-tiger/docs/DEV_WORKFLOW_QUALITY.md'
      - 'focus-tiger/docs/COLLAB.md'
      - 'WORKFLOW.md'
      - '.cursor/rules/focus-tiger-regression-lock.mdc'
      - '.cursor/rules/focus-tiger-docs.mdc'
      - 'focus-tiger/scripts/*-doc-check.js'
      - 'focus-tiger/scripts/check-docs-consistency.js'
      - 'focus-tiger/scripts/session-lock-lib.js'
      - 'focus-tiger/scripts/gate-session-lock-precommit.js'
      - 'focus-tiger/scripts/check-worktree-occupancy.js'
      - '.husky/pre-commit'
      - 'focus-tiger/scripts/rules-authority-registry.js'
      - 'focus-tiger/scripts/docs-check.js'
      - 'focus-tiger/package.json'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.cursor/rules/focus-tiger-browser-energy.mdc'
      - '.github/workflows/focus-tiger-doc-contract-check.yml'

jobs:
  docs-check:
    name: docs:check + test:smoke contract slice
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: focus-tiger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: focus-tiger/package-lock.json
      # REQUIRED: scenario-smoke → HonestyCheckInController → EmotionController → PoseManager → three.
      # Without npm ci, Behavioral contracts fail ERR_MODULE_NOT_FOUND (noise, not a product assertion).
      - name: Install dependencies
        run: npm ci
      - name: Structural alignment (registry ↔ markdown)
        run: npm run docs:check
      - name: Rules-authority contradiction unit smoke
        run: node --test scripts/rules-authority-doc-check.test.js
      - name: Docs-consistency numeric-restatement unit smoke
        run: node --test scripts/check-docs-consistency.test.js
      - name: Session-lock heartbeat/stale/gate unit smoke
        run: node --test scripts/session-lock-lib.test.js scripts/check-worktree-occupancy.test.js
      - name: Behavioral contracts (gate + scenario smoke)
        run: node --test src/core/SessionUiGate.test.js src/core/sessionUiGateContractRegistry.test.js src/core/scenario-smoke.test.js
