<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Tiger</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #e8e6e1;
        font-family: 'Noto Sans SC', system-ui, sans-serif;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
        background: #e8e6e1;
      }
      #poster {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        z-index: 1;
        opacity: 1;
        transition: opacity 500ms ease;
        pointer-events: none;
      }
      #scene-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        opacity: 0;
        transition: opacity 500ms ease;
      }
      #ui-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      #focus-hud {
        position: absolute;
        top: 20px;
        left: 20px;
        color: #2c1f14;
        font-size: 14px;
        line-height: 1.8;
        pointer-events: none;
      }
      #btn-focus {
        position: absolute;
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%);
        pointer-events: auto;
        padding: 12px 32px;
        border: none;
        border-radius: 24px;
        background: #8b2e2e;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(44, 31, 20, 0.15);
      }
      #btn-focus:active {
        transform: translateX(-50%) scale(0.97);
      }
      #loading-mask {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e8e6e1;
        color: #2c1f14;
        font-size: 18px;
        letter-spacing: 0.1em;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <img id="poster" src="/textures/poster-idle.png" alt="" />
      <canvas id="scene-canvas"></canvas>
    </div>
    <div id="loading-mask">Loading…</div>
    <div id="ui-overlay">
      <div id="focus-hud"></div>
      <button id="btn-focus" type="button">Start Focus</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
