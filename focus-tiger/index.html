<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Tiger</title>
    <link rel="stylesheet" href="/src/styles/design-tokens.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #e8e6e1;
        font-family: 'Noto Sans SC', system-ui, sans-serif;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--color-bg, #e8e6e1);
      }
      #poster {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        z-index: 1;
        opacity: 1;
        transition: opacity 500ms ease;
        pointer-events: none;
      }
      #scene-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        opacity: 0;
        transition: opacity 500ms ease;
      }
      #ui-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      #focus-hud {
        position: absolute;
        top: 20px;
        left: 20px;
        color: #2c1f14;
        font-size: 14px;
        line-height: 1.8;
        pointer-events: none;
      }
      #btn-focus {
        position: absolute;
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%);
        pointer-events: auto;
        padding: 13px 36px;
        border: 1px solid rgba(255, 230, 210, 0.35);
        border-radius: 26px;
        background: linear-gradient(
          180deg,
          var(--color-cta-top, #c47a4e) 0%,
          var(--color-accent, #b5623a) 48%,
          var(--color-cta-bottom, #8f4a2c) 100%
        );
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.02em;
        cursor: pointer;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.28) inset,
          0 -2px 0 rgba(80, 40, 20, 0.18) inset,
          0 2px 0 var(--color-cta-edge, #7a3f24),
          0 8px 18px rgba(44, 31, 20, 0.2);
        transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
      }
      #btn-focus:hover {
        filter: brightness(1.05);
      }
      #btn-focus:active {
        transform: translateX(-50%) translateY(2px) scale(0.985);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.18) inset,
          0 -1px 0 rgba(80, 40, 20, 0.2) inset,
          0 1px 0 var(--color-cta-edge, #7a3f24),
          0 3px 8px rgba(44, 31, 20, 0.18);
      }
      #loading-mask {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e8e6e1;
        color: #2c1f14;
        font-size: 18px;
        letter-spacing: 0.1em;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <img id="poster" src="/textures/poster-idle.png" alt="" />
      <canvas id="scene-canvas"></canvas>
    </div>
    <div id="loading-mask">Loading…</div>
    <div id="ui-overlay">
      <div id="focus-hud"></div>
      <button id="btn-focus" type="button">Sit with Yin</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
