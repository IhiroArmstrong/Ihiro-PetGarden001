<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Tiger</title>
    <link rel="stylesheet" href="/src/styles/design-tokens.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #e8e6e1;
        font-family: 'Noto Sans SC', system-ui, sans-serif;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--color-bg, #e8e6e1);
      }
      #poster {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        z-index: 1;
        opacity: 1;
        transition: opacity 500ms ease;
        pointer-events: none;
      }
      #scene-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        opacity: 0;
        transition: opacity 500ms ease;
      }
      #ui-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      /* Soft chrome HUD — gold ring + breathing core; ~2× for glanceability */
      #focus-hud {
        position: absolute;
        top: 18px;
        left: 18px;
        pointer-events: auto;
        font-family: var(--font-family, "Nunito", system-ui, sans-serif);
        color: var(--text-primary, #2c1f14);
      }
      #focus-hud .ft-hud {
        position: relative;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 14px 20px 14px 14px;
        border-radius: 20px;
        background: var(--color-panel-soft, rgba(228, 225, 219, 0.92));
        border: 1px solid var(--color-ink-faint, rgba(46, 43, 40, 0.1));
        box-shadow: var(--shadow-soft, 0 8px 24px rgba(44, 31, 20, 0.08));
        outline: none;
        --ft-hud-fill: 0;
      }
      #focus-hud .ft-hud__gauge {
        position: relative;
        width: 88px;
        height: 88px;
        flex-shrink: 0;
      }
      #focus-hud .ft-hud__ring-track,
      #focus-hud .ft-hud__ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        mask: radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px));
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 9px),
          #000 calc(100% - 8px)
        );
      }
      #focus-hud .ft-hud__ring-track {
        background: conic-gradient(
          from -90deg,
          rgba(74, 58, 40, 0.28) 0deg,
          rgba(74, 58, 40, 0.28) 360deg
        );
      }
      #focus-hud .ft-hud__ring {
        background: conic-gradient(
          from -90deg,
          #d4922a calc(var(--ft-hud-fill) * 360deg),
          transparent 0
        );
        opacity: 0.85;
        transition: opacity 400ms var(--ease-calm, cubic-bezier(0.33, 0.1, 0.25, 1));
      }
      #focus-hud .ft-hud__core {
        position: absolute;
        left: 50%;
        top: 50%;
        width: calc(16px + var(--ft-hud-fill) * 10px);
        height: calc(16px + var(--ft-hud-fill) * 10px);
        margin: 0;
        border-radius: 50%;
        background: radial-gradient(
          circle at 50% 45%,
          #fff6e0 0%,
          #e8a84a 38%,
          #c47a4e 72%,
          rgba(196, 122, 78, 0.15) 100%
        );
        box-shadow:
          0 0 0 2px rgba(212, 146, 42, 0.35),
          0 0 calc(8px + var(--ft-hud-fill) * 10px) rgba(212, 146, 42, 0.55);
        opacity: 0.92;
        transform: translate(-50%, -50%) scale(0.72);
        transform-origin: center;
        animation: ft-hud-breathe 4s ease-in-out infinite;
        will-change: transform;
        transition:
          width 400ms var(--ease-calm, cubic-bezier(0.33, 0.1, 0.25, 1)),
          height 400ms var(--ease-calm, cubic-bezier(0.33, 0.1, 0.25, 1)),
          opacity 400ms var(--ease-calm, cubic-bezier(0.33, 0.1, 0.25, 1)),
          box-shadow 400ms var(--ease-calm, cubic-bezier(0.33, 0.1, 0.25, 1));
        pointer-events: none;
      }
      @keyframes ft-hud-breathe {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(0.68);
        }
        50% {
          transform: translate(-50%, -50%) scale(1.28);
        }
      }
      #focus-hud .ft-hud[data-focusing='0'] .ft-hud__core {
        animation-duration: 5s;
      }
      #focus-hud .ft-hud__meta {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 7.5rem;
        line-height: 1.25;
      }
      #focus-hud .ft-hud__state {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--text-secondary, rgba(74, 58, 40, 0.78));
        letter-spacing: 0.01em;
      }
      #focus-hud .ft-hud[data-focusing="1"] .ft-hud__state {
        color: var(--text-primary, #2c1f14);
      }
      #focus-hud .ft-hud__time {
        font-size: 1.125rem;
        font-variant-numeric: tabular-nums;
        color: var(--color-ink-muted, rgba(74, 58, 40, 0.78));
        opacity: 0.55;
        transition: opacity 220ms var(--ease-calm, cubic-bezier(0.33, 0.1, 0.25, 1));
      }
      #focus-hud .ft-hud[data-focusing="1"] .ft-hud__time,
      #focus-hud .ft-hud:hover .ft-hud__time,
      #focus-hud .ft-hud:focus-within .ft-hud__time {
        opacity: 0.92;
      }
      #focus-hud .ft-hud__detail {
        position: absolute;
        left: 0;
        top: calc(100% + 8px);
        min-width: 11rem;
        padding: 0.55rem 0.8rem;
        border-radius: var(--radius-sm, 10px);
        background: var(--color-surface-warm, #f8f1e4);
        border: 1px solid var(--color-surface-border, rgba(139, 115, 85, 0.22));
        box-shadow: var(--shadow-soft, 0 8px 24px rgba(44, 31, 20, 0.08));
        font-size: 1rem;
        color: var(--text-primary, #2c1f14);
        opacity: 0;
        pointer-events: none;
        transition: opacity 220ms var(--ease-calm, cubic-bezier(0.33, 0.1, 0.25, 1));
      }
      #focus-hud .ft-hud:hover .ft-hud__detail,
      #focus-hud .ft-hud:focus-within .ft-hud__detail {
        opacity: 1;
      }
      #focus-hud .ft-hud__detail-line {
        display: block;
      }
      #btn-focus {
        position: absolute;
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%);
        pointer-events: auto;
        padding: 13px 36px;
        border: 1px solid rgba(255, 230, 210, 0.35);
        border-radius: 26px;
        background: linear-gradient(
          180deg,
          var(--color-cta-top, #c47a4e) 0%,
          var(--color-accent, #b5623a) 48%,
          var(--color-cta-bottom, #8f4a2c) 100%
        );
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.02em;
        cursor: pointer;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.28) inset,
          0 -2px 0 rgba(80, 40, 20, 0.18) inset,
          0 2px 0 var(--color-cta-edge, #7a3f24),
          0 8px 18px rgba(44, 31, 20, 0.2);
        transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
      }
      #btn-focus:hover {
        filter: brightness(1.05);
      }
      #btn-focus:active {
        transform: translateX(-50%) translateY(2px) scale(0.985);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.18) inset,
          0 -1px 0 rgba(80, 40, 20, 0.2) inset,
          0 1px 0 var(--color-cta-edge, #7a3f24),
          0 3px 8px rgba(44, 31, 20, 0.18);
      }
      #loading-mask {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e8e6e1;
        color: #2c1f14;
        font-size: 18px;
        letter-spacing: 0.1em;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <img id="poster" src="/textures/poster-idle.png" alt="" />
      <canvas id="scene-canvas"></canvas>
    </div>
    <div id="loading-mask">Loading…</div>
    <div id="ui-overlay">
      <div id="focus-hud"></div>
      <button id="btn-focus" type="button">Sit with Yin</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
