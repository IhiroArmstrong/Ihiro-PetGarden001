<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Tiger · System TTS Probe</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111;
        color: #f5f5f5;
      }
      .card {
        width: min(560px, calc(100vw - 32px));
        padding: 24px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.06);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 16px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.78);
      }
      .status {
        min-height: 1.5rem;
        margin: 12px 0;
        font-weight: 600;
      }
      .status[data-state='speaking'] {
        color: #9ec5ff;
      }
      .status[data-state='error'] {
        color: #ff8a8a;
      }
      .sample {
        margin: 12px 0;
        padding: 12px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.12);
        line-height: 1.5;
      }
      .actions {
        display: flex;
        gap: 12px;
        margin-top: 16px;
        flex-wrap: wrap;
      }
      button {
        flex: 1 1 140px;
        border: 0;
        border-radius: 999px;
        padding: 12px 16px;
        font-size: 1rem;
        cursor: pointer;
      }
      #speakEnBtn {
        background: #9ec5ff;
        color: #102030;
      }
      #speakJaBtn {
        background: #c9b8ff;
        color: #201530;
      }
      #stopBtn {
        background: #f5c26b;
        color: #241a05;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .gate {
        margin-top: 16px;
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.65);
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>System TTS · Slice 0 Probe</h1>
      <p>
        macOS on-device AVSpeechSynthesizer lab only. No product focus-end or global sound
        switch is mounted in this slice.
      </p>
      <div id="status" class="status" data-state="idle">Idle</div>
      <div class="sample">
        <div><strong>EN</strong> Return to a single breath.</div>
        <div style="margin-top: 8px"><strong>JA</strong> 一つの呼吸に戻りましょう。</div>
      </div>
      <div class="actions">
        <button id="speakEnBtn" type="button">Speak EN</button>
        <button id="speakJaBtn" type="button">Speak JA</button>
        <button id="stopBtn" type="button" disabled>Stop</button>
      </div>
      <pre id="gate" class="gate"></pre>
    </main>
    <script>
      const statusEl = document.getElementById('status');
      const gateEl = document.getElementById('gate');
      const speakEnBtn = document.getElementById('speakEnBtn');
      const speakJaBtn = document.getElementById('speakJaBtn');
      const stopBtn = document.getElementById('stopBtn');
      const api = window.desktopShell?.systemTtsProbe;

      function setStatus(text, state) {
        statusEl.textContent = text;
        statusEl.dataset.state = state || 'idle';
      }

      function setBusy(speaking) {
        speakEnBtn.disabled = speaking;
        speakJaBtn.disabled = speaking;
        stopBtn.disabled = !speaking;
      }

      function renderSnapshot(snapshot) {
        if (!snapshot) return;
        if (snapshot.status === 'speaking') {
          const latency =
            snapshot.startLatencyMs != null ? ` (${snapshot.startLatencyMs} ms)` : '';
          setStatus(`Speaking…${latency}`, 'speaking');
          setBusy(true);
        } else if (snapshot.status === 'error') {
          setStatus(snapshot.error || 'Failed', 'error');
          setBusy(false);
        } else if (snapshot.status === 'done') {
          setStatus('Done', 'idle');
          setBusy(false);
        } else {
          setStatus('Idle', 'idle');
          setBusy(false);
        }
      }

      async function boot() {
        if (!api) {
          setStatus('Probe API unavailable', 'error');
          return;
        }
        api.onStatus(renderSnapshot);
        const [enGate, jaGate] = await Promise.all([
          api.getGate('en-US'),
          api.getGate('ja-JP')
        ]);
        gateEl.textContent = JSON.stringify({ enGate, jaGate }, null, 2);
        renderSnapshot(await api.snapshot());
      }

      async function speak(locale) {
        if (!api) return;
        setStatus('Starting…', 'speaking');
        setBusy(true);
        const result = await api.speak({ locale });
        if (!result?.ok) {
          setStatus(result?.userMessage || 'Could not start speaking', 'error');
          setBusy(false);
          return;
        }
        const latency =
          result.startLatencyMs != null ? ` (${result.startLatencyMs} ms to start)` : '';
        setStatus(`Done${latency}`, 'idle');
        setBusy(false);
      }

      speakEnBtn.addEventListener('click', () => speak('en-US'));
      speakJaBtn.addEventListener('click', () => speak('ja-JP'));

      stopBtn.addEventListener('click', async () => {
        if (!api) return;
        setStatus('Stopping…', 'speaking');
        stopBtn.disabled = true;
        const result = await api.stop();
        if (!result?.ok) {
          setStatus(result?.userMessage || 'Could not stop', 'error');
          setBusy(false);
          return;
        }
        setStatus('Stopped', 'idle');
        setBusy(false);
      });

      boot();
    </script>
  </body>
</html>
