<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Tiger · Voice Input Probe</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111;
        color: #f5f5f5;
      }
      .card {
        width: min(520px, calc(100vw - 32px));
        padding: 24px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.06);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 16px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.78);
      }
      .status {
        min-height: 1.5rem;
        margin: 12px 0;
        font-weight: 600;
      }
      .status[data-state='listening'] {
        color: #7bd389;
      }
      .status[data-state='transcribing'] {
        color: #f5c26b;
      }
      .status[data-state='error'] {
        color: #ff8a8a;
      }
      textarea {
        width: 100%;
        min-height: 120px;
        box-sizing: border-box;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(0, 0, 0, 0.25);
        color: inherit;
        padding: 12px;
        resize: vertical;
      }
      .actions {
        display: flex;
        gap: 12px;
        margin-top: 16px;
      }
      button {
        flex: 1;
        border: 0;
        border-radius: 999px;
        padding: 12px 16px;
        font-size: 1rem;
        cursor: pointer;
      }
      #speakBtn {
        background: #7bd389;
        color: #102014;
      }
      #stopBtn {
        background: #f5c26b;
        color: #241a05;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .gate {
        margin-top: 16px;
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.65);
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Voice Input · Slice 0 Probe</h1>
      <p>
        English on-device Speak-to-type lab only. No product Confide / Arrival / Reflection
        buttons are mounted in this slice.
      </p>
      <div id="status" class="status" data-state="idle">Idle</div>
      <textarea id="transcript" placeholder="Transcript appears here…" readonly></textarea>
      <div class="actions">
        <button id="speakBtn" type="button">Speak</button>
        <button id="stopBtn" type="button" disabled>Stop</button>
      </div>
      <pre id="gate" class="gate"></pre>
    </main>
    <script>
      const statusEl = document.getElementById('status');
      const transcriptEl = document.getElementById('transcript');
      const gateEl = document.getElementById('gate');
      const speakBtn = document.getElementById('speakBtn');
      const stopBtn = document.getElementById('stopBtn');
      const api = window.desktopShell?.voiceInputProbe;

      function setStatus(text, state) {
        statusEl.textContent = text;
        statusEl.dataset.state = state || 'idle';
      }

      function renderSnapshot(snapshot) {
        if (!snapshot) return;
        if (snapshot.status === 'listening') {
          setStatus('Listening…', 'listening');
          speakBtn.disabled = true;
          stopBtn.disabled = false;
        } else if (snapshot.status === 'transcribing') {
          setStatus('Transcribing…', 'transcribing');
          speakBtn.disabled = true;
          stopBtn.disabled = true;
        } else if (snapshot.status === 'done') {
          setStatus('Done', 'idle');
          speakBtn.disabled = false;
          stopBtn.disabled = true;
          if (snapshot.transcript) transcriptEl.value = snapshot.transcript;
        } else if (snapshot.status === 'error') {
          setStatus(snapshot.error || 'Failed', 'error');
          speakBtn.disabled = false;
          stopBtn.disabled = true;
        } else {
          setStatus('Idle', 'idle');
          speakBtn.disabled = false;
          stopBtn.disabled = true;
        }
      }

      async function boot() {
        if (!api) {
          setStatus('Probe API unavailable', 'error');
          return;
        }
        api.onStatus(renderSnapshot);
        const gate = await api.getGate();
        gateEl.textContent = JSON.stringify(gate?.json || gate, null, 2);
        if (gate?.gatePassed === false) {
          setStatus(
            gate?.json?.error === 'on_device_not_supported'
              ? 'On-device English STT not available'
              : 'On-device gate failed — see details below',
            'error'
          );
        }
        renderSnapshot(await api.snapshot());
      }

      speakBtn.addEventListener('click', async () => {
        if (!api) return;
        setStatus('Listening…', 'listening');
        speakBtn.disabled = true;
        stopBtn.disabled = false;
        const result = await api.start();
        if (!result?.ok) {
          setStatus(result?.userMessage || 'Could not start listening', 'error');
          speakBtn.disabled = false;
          stopBtn.disabled = true;
        }
      });

      stopBtn.addEventListener('click', async () => {
        if (!api) return;
        setStatus('Transcribing…', 'transcribing');
        stopBtn.disabled = true;
        const result = await api.stop();
        if (!result?.ok) {
          setStatus(result?.userMessage || 'Transcription failed', 'error');
          speakBtn.disabled = false;
          return;
        }
        transcriptEl.value = result.transcript || '';
        setStatus('Done', 'idle');
        speakBtn.disabled = false;
      });

      boot();
    </script>
  </body>
</html>
